async function genStory(){
  const c=client();const g=storyGen;const gv=id=>document.getElementById(id);g.from=gv("sg-from").value;g.objective=gv("sg-obj").value;g.theme=gv("sg-theme").value;if(gv("sg-blink"))g.blink=gv("sg-blink").value;
  const p=g.from?S.posts.find(x=>x.id===g.from):null;

  g.busy=true;g.err="";render();const ctx=c.stories||{};
  const pd=p&&p.date?parse(p.date):today();const dayName=DAYS[(pd.getDay()+6)%7];
  const prev=S.stories.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,8).map(x=>"- "+x.title+(x.angle?": "+x.angle:"")+" ("+x.category+")").join("\n");
  const prompt=`Você orienta a criação de stories do Instagram, em português do Brasil, para a conta ${c.name} ${c.handle||""}.
Stories são para quem já segue: proximidade e conversa. Eles precisam parecer o dia a dia real da pessoa, não um anúncio.
Público: ${c.audience||"-"}
${amText(c)}Tom de voz: ${c.tone||"leve e humanizado"}
Contexto dos stories: papel: ${ctx.goal||"-"} · assuntos que geram conversa: ${ctx.topics||"-"} · quadros fixos: ${ctx.rituals||"-"} · o que mostrar: ${ctx.show||"-"} · o que evitar: ${ctx.avoid||"-"}
Dia: ${dayName}${p&&p.date?", "+dmy(p.date):""}
Objetivo: ${(SOBJ.find(o=>o[0]===g.objective)||[,g.objective])[1]}
${p?`Pauta do feed nesse dia: "${p.title}" (${p.format}, pilar ${p.pillar||"-"}). Use a pauta como assunto de fundo, não como roteiro: não repita o gancho do reel e não transforme os stories em propaganda do post. A ligação com a pauta deve surgir de algo que aconteceu no dia (gravar, ler uma notícia, uma conversa com cliente, um momento da rotina).`:""}
${p?"":`TEMA LIVRE. O assunto não precisa ser sobre a marca nem sobre trabalho: pode ser algo universal do dia a dia que qualquer seguidor reconhece e responde. Território escolhido: ${(TERR.find(x=>x[0]===g.terr)||[,"surpreenda"])[1]}${g.terr==="surpresa"?" (escolha um território do cotidiano que combine com a pessoa)":""}.
A conexão com o perfil vem da personalidade e do jeito de olhar, não do serviço. Interesses e estética que aparecem no perfil: ${[(c.diagnosis&&c.diagnosis.champion)||"",ctx.topics||"",(c.pillars||[]).filter(x=>/lifestyle/i.test(x.name)).map(x=>x.delivers).join(" ")].join(" ").slice(0,600)||"-"}.
Ligação com a marca: ${g.blink==="nenhuma"?"nenhuma, é só sobre o dia":g.blink==="clara"?"uma ponte natural com o trabalho no fim, sem venda":"no máximo um detalhe sutil (um objeto, um comentário de passagem), sem citar o serviço"}.`}
${g.theme?"O que está acontecendo no dia: "+g.theme:"Sem contexto do dia informado: proponha um momento comum e verossímil e deixe claro que é sugestão."}
Ideias já salvas (traga ângulos diferentes delas):
${prev||"nenhuma"}
O que você deve fazer:
1. Leia com atenção o que a pessoa está fazendo hoje e descubra o que, nisso, interessa a quem já segue essa conta. Pense como estrategista: que pedaço desse momento gera identificação, curiosidade ou conversa com esse público específico.
2. Devolva CONTEXTO para a pessoa criar, nunca o texto pronto nem a fala completa. Ela é quem vai falar, do jeito dela.
3. Stories não precisam ser inspiracionais nem aspiracionais. O comum, o pequeno e o imperfeito conectam. Nem todo story precisa de texto: às vezes é só uma imagem, um som do ambiente ou um vídeo sem fala.
4. Não existe sequência fixa. Pode ser um único story, dois ou alguns, o que fizer sentido para o momento.
5. Interação só quando for natural. Se entrar, diga a intenção da pergunta, não a frase pronta.
6. Nada de tom de propaganda, frases de efeito, exclamações, "gente", promessas ou números de impacto. Sem travessões.
Gere 2 ideias com ângulos diferentes.
Responda só com JSON: [{"title":"nome curto e simples","category":"${SCATS.map(x=>x[0]).join("|")}","read":"1 ou 2 frases: por que esse momento interessa a esse público","angle":"o ângulo, em 1 frase","format":"como registrar (ex.: um story só com foto e som ambiente; vídeo curto falando; dois ou três stories ao longo do dia)","moments":["o que mostrar ou registrar, em 3 a 6 palavras cada, de 1 a 4 itens"],"talk":["pontos para a pessoa falar ou escrever, em palavras-chave ou meia frase, de 2 a 4 itens"],"interaction":{"sticker":"${STICKERS.map(s=>s[0]).join("|")}","intent":"o que essa interação quer descobrir ou provocar, ou vazio se não houver"},"timing":"melhor momento do dia para postar","avoid":"o que evitar para não soar forçado","after":"o que fazer depois, se houver respostas"}]`;
  try{const arr=await S.sample.json(prompt,{cache:false});const L=x=>(Array.isArray(x)?x:[]).map(String).filter(Boolean);
    g.out=(Array.isArray(arr)?arr:[arr]).filter(Boolean).slice(0,3).map(o=>({title:String(o.title||"Ideia"),category:SCATS.some(x=>x[0]===o.category)?o.category:"rotina",read:String(o.read||""),angle:String(o.angle||""),format:String(o.format||""),moments:L(o.moments).slice(0,4),talk:L(o.talk).slice(0,4),interaction:o.interaction&&STK[o.interaction.sticker]&&o.interaction.sticker!=="nenhum"&&o.interaction.intent?{sticker:o.interaction.sticker,intent:String(o.interaction.intent)}:null,timing:String(o.timing||""),avoid:String(o.avoid||""),after:String(o.after||"")}));
    if(!g.out.length)throw {code:"invalid_json"}}
  catch(e){g.err=e&&e.code==="invalid_json"?"A IA não devolveu uma sequência legível. Tente de novo.":parseErr(e)}
  g.busy=false;render();
}

    overlayEl.remove();overlayEl=null;

async function applyGrid(){

  if((el=t.closest("[data-lbrief]"))){const p=S.posts.find(x=>x.id===el.dataset.lbrief);if(p)copyBrief(designBrief(client(),p));return}
  if((el=t.closest("[data-ldel]"))){const id=el.dataset.ldel;document.getElementById("la-"+id).innerHTML=`<span class="small">Excluir esta ideia?</span><button class="btn sm danger" data-ldelok="${esc(id)}">Confirmar</button><button class="btn sm ghost" data-lcancel>Cancelar</button>`;return}
  if((el=t.closest("[data-ldelok]"))){const id=el.dataset.ldelok;save(()=>S.db.doc("posts/"+id).delete(),"Ideia excluída");return}
  if((el=t.closest("[data-lcancel]"))){render();return}
  if((el=t.closest("[data-lok]"))){const id=el.dataset.lok;const d=document.getElementById("ld-"+id).value;if(!d){toast("Escolha a data");return}save(()=>S.db.doc("posts/"+id).update({date:d}),"Pauta agendada para "+wd(d)+" "+dmy(d));return}
  if((el=t.closest("[data-dview]"))){e.stopPropagation();openDate(el.dataset.dview);return}

  if((el=t.closest("[data-susedok]"))){const id=el.dataset.susedok;const v=document.getElementById("sr-"+id).value;save(()=>S.db.doc("stories/"+id).update({status:"usada",usedAt:iso(today()),responses:v===""?null:Number(v)}),"Sequência marcada como usada");return}

  if((el=t.closest("[data-sdelok]"))){save(()=>S.db.doc("stories/"+el.dataset.sdelok).delete(),"Sequência excluída");return}
  if((el=t.closest("[data-st-save]"))){const c=client();const o=storyGen.out[+el.dataset.stSave];if(o){save(()=>S.db.collection("stories").add({clientId:c.id,...o,objective:storyGen.objective,fromPost:storyGen.from||null,origin:storyGen.theme||"",status:"ideia",createdAt:new Date().toISOString()}),"Ideia salva no banco");storyGen.out=storyGen.out.filter(x=>x!==o);if(!storyGen.out.length)storyGen.out=null;render()}return}
  if((el=t.closest("[data-st]"))){const a=el.dataset.st;const c=client();
    if(a==="edit"){S.editStories=true;render()}

    if(a==="save-ctx"){const ctx={};["goal","topics","rituals","show","avoid","weekly"].forEach(k=>ctx[k]=document.getElementById("sc-"+k).value.trim());S.editStories=false;save(()=>S.db.doc("clients/"+c.id).update({stories:ctx}),"Contexto salvo");render()}

    if(a==="discard"){storyGen.out=null;render()}
    if(a==="save-gen"){const o=storyGen.out;save(()=>S.db.collection("stories").add({clientId:c.id,...o,objective:storyGen.objective,fromPost:storyGen.from||null,status:"ideia",createdAt:new Date().toISOString()}),"Sequência salva no banco");storyGen.out=null;render()}
    return}
  if((el=t.closest("[data-hpick]"))){readHW();S.hw.tech=el.dataset.hpick;S.hw.out=null;S.hw.chosen="";hwBuild();return}
  if((el=t.closest("[data-hchoose]"))){readHW();const h=S.hw.out.hooks[+el.dataset.hchoose];if(h){S.hw.chosen=h.text;render()}return}
  if((el=t.closest("[data-rmimg]"))){readRef();refImgs.splice(+el.dataset.rmimg,1);render();return}

  if((el=t.closest("[data-huse]"))){readHW();const w=S.hw;const tid=el.dataset.huse;w.out=null;w.chosen="";w.err="";if(w.theme.trim()){w.tech=tid;hwBuild()}else{w.tech=null;w.sugg=[];w.preTech=tid;render()}window.scrollTo({top:0,behavior:"smooth"});return}
  if((el=t.closest("[data-hcopy]"))){const h=bankItems().find(x=>x.id===el.dataset.hcopy);if(h)copyText(h.text);return}
  if((el=t.closest("[data-hdel]"))){const id=el.dataset.hdel;document.getElementById("hk-"+id).innerHTML=`<button class="btn sm danger" data-hdelok="${esc(id)}">Confirmar exclusão</button>`;return}
  if((el=t.closest("[data-hdelok]"))){save(()=>S.db.doc("hooks/"+el.dataset.hdelok).delete(),"Gancho excluído");return}
  if((el=t.closest("[data-hw]"))){const a=el.dataset.hw;readHW();const w=S.hw;
    if((a==="suggest"||a==="manual")&&w.preTech&&w.theme.trim()){w.tech=w.preTech;w.preTech=null;hwBuild();return}
    if(a==="suggest")hwSuggest();
    if(a==="manual"){if(!w.theme.trim()){w.err="Escreva o tema primeiro.";render();return}w.manual=true;w.sugg=TECHS.map(t=>({tech:t.id,why:t.desc}));w.err="";render()}
    if(a==="back"){if(w.tech){w.tech=null;w.out=null;w.chosen=""}else{w.sugg=[];w.manual=false}w.err="";render()}
    if(a==="reset"){S.hw=newHW();render()}
    if(a==="regen")hwBuild();
    if(a==="save")hwSave(false);
    if(a==="save-post")hwSave(true);
    if(a==="ref-prompt"){readRef();const txt=chromePrompt();try{navigator.clipboard.writeText(txt).then(()=>toast("Pedido copiado. Cole no Claude no Chrome."),()=>{copyFallback(txt,"Pedido para o Claude no Chrome")})}catch(e){copyFallback(txt,"Pedido para o Claude no Chrome")}return}
    if(a==="ref-ai")refAI();
    if(a==="ref-queue")refQueue();
    if(a==="ref-clear"){S.ref.an=null;render()}
    if(a==="ref-save")refSave();
    return}
  if((el=t.closest("[data-open-paste]"))){readDraft();S.draft={...(S.draft||{}),target:"profile",values:{},text:(S.draft&&S.draft.text)||"",kind:(S.draft&&S.draft.kind)||"parcial"};S.openPaste=true;render();const b=document.getElementById("paste-blk");if(b){b.open=true;b.scrollIntoView({behavior:"smooth",block:"start"})}return}
  if((el=t.closest("[data-target]"))){readDraft();S.draft={...S.draft,target:el.dataset.target,values:{}};render();return}
  if((el=t.closest("[data-new]"))){const v=el.dataset.new;openPost(null,v==="lib"?"":v);return}
  if((el=t.closest("[data-cal]"))){const a=el.dataset.cal;if(a==="today")S.anchor=today();else{const s=a==="next"?1:-1;S.anchor=S.calView==="week"?addDays(S.anchor,7*s):new Date(S.anchor.getFullYear(),S.anchor.getMonth()+s,1)}render();return}
  if((el=t.closest("[data-calview]"))){S.calView=el.dataset.calview;try{localStorage.setItem("cc_cal",S.calView)}catch(_){}render();return}
  if((el=t.closest("[data-rm]"))){el.closest(".fgrid").remove();return}
  if((el=t.closest("[data-add]"))){const k=el.dataset.add;const c=client();const box=document.getElementById("rows-"+k);const html={pillar:pillarRow,grid:g=>gridRow(g,c.pillars),goal:goalRow,ref:refRow}[k]();box.insertAdjacentHTML("beforeend",html);return}
  if((el=t.closest("[data-snapdel]"))){const id=el.dataset.snapdel;document.getElementById("sz-"+id).innerHTML=`<button class="btn sm danger" data-snapok="${esc(id)}">Confirmar</button>`;return}
  if((el=t.closest("[data-snapok]"))){save(()=>S.db.doc("snapshots/"+el.dataset.snapok).delete(),"Print excluído");return}
  if((el=t.closest("[data-andel]"))){const id=el.dataset.andel;document.getElementById("az-"+id).innerHTML=`<button class="btn sm danger" data-anok="${esc(id)}">Confirmar exclusão</button>`;return}
  if((el=t.closest("[data-anok]"))){save(()=>S.db.doc("analyses/"+el.dataset.anok).delete(),"Leitura excluída");return}
  const ae=t.closest("[data-act]");if(!ae)return;const act=ae.dataset.act;
  if(act==="new-client")newClient();
  if(act==="manage-dates")manageDates();
  if(act==="edit-strategy"){S.editStrategy=true;render();window.scrollTo({top:0})}
  if(act==="cancel-strategy"){S.editStrategy=false;render()}
  if(act==="apply-grid")save(applyGrid);
  if(act==="ask-del-client")document.getElementById("del-client-zone").innerHTML=`<span class="small">Isso remove o plano do cliente. Pautas e prints ficam guardados.</span><button type="button" class="btn danger" data-act="do-del-client">Excluir cliente</button><button type="button" class="btn ghost" data-act="cancel-strategy">Cancelar</button>`;
  if(act==="do-del-client"){const id=S.clientId;S.clientId=null;S.editStrategy=false;save(()=>S.db.doc("clients/"+id).delete(),"Cliente excluído")}
  if(act==="parse-insights")parseInsights();
  if(act==="save-insights")saveInsights();
  if(act==="clear-insights"){S.draft=null;imgFiles=[];render()}
  if(act==="run-ai")runAI();
  if(act==="edit-review"){S.editReview=true;render()}
  if(act==="cancel-review"){S.editReview=false;render()}
  if(act==="save-review")saveReview();
  if(act==="ai-review")aiReview();
  if(act==="stop-ai"&&aiCtl)aiCtl.abort();
});
view.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("mcell")){e.preventDefault();openPost(null,e.target.dataset.new)}});
view.addEventListener("input",e=>{const id=e.target&&e.target.id||"";if(["pg-theme","pg-extra","pg-ex","pg-fmt"].includes(id)){const g=ptGen();g[id.slice(3)]=e.target.value;ptRefresh()}if(id==="pt-q"){ptFilter.q=e.target.value;clearTimeout(window.__ptq);window.__ptq=setTimeout(()=>{render();const q=document.getElementById("pt-q");if(q){q.focus();q.selectionStart=q.selectionEnd=q.value.length}},250)}});
view.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.lstage){const id=e.target.dataset.lstage;save(()=>S.db.doc("leads/"+id).update({stage:e.target.value,updatedAt:new Date().toISOString()}),"Etapa atualizada");return}
  const id=e.target.id;

  if(id==="sg-from"&&storyGen){const gv=x=>document.getElementById(x);storyGen.from=e.target.value;storyGen.theme=gv("sg-theme").value;storyGen.objective=gv("sg-obj").value;if(gv("sg-blink"))storyGen.blink=gv("sg-blink").value;render();return}

  if(id==="hf-tech"){hookFilter.tech=e.target.value;render()}

  if(id==="hf-origin"){hookFilter.origin=e.target.value;render()}

  if(id==="an-group"){groupBy=e.target.value;render()}
});
view.addEventListener("input",e=>{if(S.tab==="resultados")readDraft();if(S.tab==="ganchos"){readHW();if(e.target.id==="hf-q"){hookFilter.q=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById("hf-q");if(el){el.focus();el.setSelectionRange(pos,pos)}}}});
view.addEventListener("submit",e=>{if(e.target.id==="strategy-form"){e.preventDefault();const c=client();const body=readStrategyForm(c);delete body.id;S.editStrategy=false;save(()=>S.db.doc("clients/"+c.id).set(body),"Plano salvo");render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlayEl)closeOverlay()});
document.addEventListener("paste",e=>{if(e.target&&(e.target.id==="in-text"||e.target.id==="p-paste")&&S.sample){const id=e.target.id;setTimeout(()=>{const v=document.getElementById(id);const b=document.querySelector(id==="in-text"?'[data-act="parse-insights"]':'[data-act="post-parse"]');if(v&&v.value.trim().length>20&&b&&!b.disabled)b.click()},80);return}if(e.target&&e.target.id==="rf-ext"&&S.sample){setTimeout(()=>{const v=document.getElementById("rf-ext");if(v&&v.value.trim().length>40)refAI()},60);return}if(S.tab!=="ganchos"||overlayEl||!document.getElementById("rf-drop"))return;const files=[...(e.clipboardData&&e.clipboardData.items||[])].filter(i=>i.kind==="file"&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);if(!files.length)return;e.preventDefault();addRefImgs(files)});

const tip=document.getElementById("tip");

view.addEventListener("pointerleave",()=>{tip.hidden=true});

boot();
})();
</script>

<script>
(function(){
const COLS=["clients","posts","snapshots","hooks","stories","analyses","prompts","leads"];
const MODE=window.__CENTRAL_MODE||"claude";
async function getDb(){try{return window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){return null}}
async function dump(db){const out={app:"central-maiara",version:1,exportedAt:new Date().toISOString(),collections:{}};for(const c of COLS){const s=await db.collection(c).get();out.collections[c]=s.docs.map(d=>({id:d.id,data:d.data()}))}return out}
function st(t){const el=document.getElementById("bk-st");if(el)el.textContent=t}
function mount(){
 const foot=document.querySelector(".sb-foot");if(!foot||document.getElementById("bk-box"))return;
 const box=document.createElement("div");box.id="bk-box";box.style.cssText="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center";
 const b=(id,l)=>`<button type="button" id="${id}" class="sb-add" style="flex:1;min-width:0;margin:0;font-size:12px;padding:6px 8px">${l}</button>`;
 box.innerHTML=MODE==="site"?b("bk-down","Baixar backup")+b("bk-paste","Colar backup")+b("bk-imp","Importar arquivo")+'<input type="file" id="bk-file" accept="application/json,.json" hidden>':b("bk-copy","Copiar backup");
 box.insertAdjacentHTML("beforeend",'<span id="bk-st" style="width:100%;font-size:11px;opacity:.75"></span>');
 foot.after(box);
 box.addEventListener("click",async e=>{
  const id=e.target.id;const db=await getDb();if(!db){st("Banco indisponível.");return}
  try{
   if(id==="bk-copy"){st("Gerando...");const d=await dump(db);await navigator.clipboard.writeText(JSON.stringify(d));st("Backup copiado. Cole no arquivo de importação.")}
   if(id==="bk-down"){st("Gerando...");const d=await dump(db);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}));a.download="central-maiara-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();st("Backup baixado.")}
   if(id==="bk-imp"){document.getElementById("bk-file").click()}
   if(id==="bk-paste"){const t=await navigator.clipboard.readText();prep(t)}
   if(id==="bk-yes"){const d=window.__bkPending;let n=0;for(const c of COLS){for(const r of (d.collections[c]||[])){await db.collection(c).doc(r.id).set(r.data);n++;if(n%10===0)st("Importando... "+n)}}window.__bkPending=null;st("Importação concluída: "+n+" registros.")}
   if(id==="bk-no"){window.__bkPending=null;st("Importação cancelada.")}
  }catch(err){st("Não deu certo: "+(err&&err.message||err))}
 });
 function prep(txt){try{const d=JSON.parse(txt);if(!d||!d.collections)throw new Error("x");const n=Object.values(d.collections).reduce((a,x)=>a+x.length,0);window.__bkPending=d;document.getElementById("bk-st").innerHTML=n+" registros. Isso substitui os que tiverem o mesmo id. <button type=button id=bk-yes>Importar</button> <button type=button id=bk-no>Cancelar</button>"}catch(err){st("Backup inválido. Copie de novo na Central do Claude.")}}
 box.addEventListener("change",async e=>{if(e.target.id!=="bk-file")return;const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!d.collections)throw new Error("arquivo inválido");const n=Object.values(d.collections).reduce((a,x)=>a+x.length,0);window.__bkPending=d;document.getElementById("bk-st").innerHTML=n+" registros. Isso substitui os que tiverem o mesmo id. <button type=button id=bk-yes>Importar</button> <button type=button id=bk-no>Cancelar</button>"}catch(err){st("Arquivo inválido.")}e.target.value=""});
}
if(document.readyState!=="loading")mount();else document.addEventListener("DOMContentLoaded",mount);
})();
</script></body></html>
