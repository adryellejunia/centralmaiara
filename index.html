<title>Central Maiara Cavasin</title>

<style>
/* Layout: app com barra lateral (clientes + etapas do método) e área de trabalho; direção "Sálvia": verde-acinzentado, grafite na navegação, lima só na ação principal */
:root{
  --bg:#f3eee2; --panel:#fffdf8; --raised:#f6f1e6; --ink:#22211c; --muted:#5b584e; --faint:#716d63; --line:#e5ddcb;
  --oa:#3e6276; --ob:#9a7d1e; --oc:#a3402c;
  --mint:#dbe6da; --mint-2:#eef2e6; --shadow:0 1px 2px rgba(60,50,20,.06),0 8px 24px -16px rgba(60,50,20,.18);
  --accent:#4d6b3c; --cta:#d5e24a; --cta-edge:#b3bf32; --cta-ink:#23251a;
  --side:#1d1c19; --side-ink:#efece4; --side-muted:#a6a398; --side-line:#3a3832; --side-hover:#2d2b26;
  --hero:#44574d; --hero-ink:#f2f5f0; --hero-muted:#c6d2c9; --hero-accent:#d5e24a; --hero-line:#5b6e63;
  --p1:#b0703a; --p2:#3e6276; --p3:#4f7a6a; --p4:#7a5c86; --p5:#9a7d1e;
  --good:#3f6b3a; --good-bg:#dbe8d3; --warn:#85650f; --warn-bg:#f1e8c6; --crit:#a3402c; --crit-bg:#f2dcd3; --info:#3e6276; --info-bg:#dae6ec;
  --font:'Nunito Sans','Segoe UI',Arial,sans-serif; --display:'Poppins','Segoe UI',Arial,sans-serif; --mono:'Poppins','Segoe UI',Arial,sans-serif; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141512; --panel:#1d1f1b; --raised:#252821; --ink:#ecebe4; --muted:#b2afa4; --faint:#928f85; --line:#33362e;
  --oa:#73a0bd; --ob:#c9a640; --oc:#ee8a76;
  --mint:#25302a; --mint-2:#1f2621; --shadow:none;
  --accent:#b5cf8f; --cta:#d5e24a; --cta-edge:#d5e24a; --cta-ink:#1d2016;
  --side:#0f1210; --side-ink:#e8ece6; --side-muted:#98a39a; --side-line:#2c332d; --side-hover:#1c221d;
  --hero:#26332c; --hero-ink:#eef2ec; --hero-muted:#aebcb2; --hero-accent:#d5e24a; --hero-line:#3a4a40;
  --p1:#d08e55; --p2:#73a0bd; --p3:#7fb09c; --p4:#ab8bbd; --p5:#c9a640;
  --good:#9cc47f; --good-bg:#24321b; --warn:#e0b850; --warn-bg:#352b12; --crit:#ee8a76; --crit-bg:#3d1f18; --info:#8fb6e0; --info-bg:#1b2a3a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141512; --panel:#1d1f1b; --raised:#252821; --ink:#ecebe4; --muted:#b2afa4; --faint:#928f85; --line:#33362e;
  --oa:#73a0bd; --ob:#c9a640; --oc:#ee8a76;
  --mint:#25302a; --mint-2:#1f2621; --shadow:none;
  --accent:#b5cf8f; --cta:#d5e24a; --cta-edge:#d5e24a; --cta-ink:#1d2016;
  --side:#0f1210; --side-ink:#e8ece6; --side-muted:#98a39a; --side-line:#2c332d; --side-hover:#1c221d;
  --hero:#26332c; --hero-ink:#eef2ec; --hero-muted:#aebcb2; --hero-accent:#d5e24a; --hero-line:#3a4a40;
  --p1:#d08e55; --p2:#73a0bd; --p3:#7fb09c; --p4:#ab8bbd; --p5:#c9a640;
  --good:#9cc47f; --good-bg:#24321b; --warn:#e0b850; --warn-bg:#352b12; --crit:#ee8a76; --crit-bg:#3d1f18; --info:#8fb6e0; --info-bg:#1b2a3a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:-.4px}
h1{font-size:30px} h2{font-size:21px} h3{font-size:16.5px} h4{font-size:15px}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 14px;border-radius:var(--r);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cta);border-color:var(--cta-edge);color:var(--cta-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.onhero{background:transparent;border-color:var(--hero-line);color:var(--hero-ink)}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.clientbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clientbar select{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);font-weight:600;max-width:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font-weight:500;color:var(--muted);white-space:nowrap;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--cta);color:var(--cta-ink);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.notice{padding:12px 16px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);font-size:14px}
.panel{background:var(--panel);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
/* hero Hoje */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.hero>div{padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hero>div+div{border-left:1px solid var(--hero-line)}
.hero .eyebrow{color:var(--hero-muted)}
.hero .muted{color:var(--hero-muted)}
.hero h2{font-size:26px}
.hero .hook{font-size:17px;line-height:1.45;border-left:3px solid var(--hero-accent);padding-left:14px}
.next{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.next b{color:var(--hero-accent);font-size:15px}
.verdict{display:flex;flex-direction:column;gap:10px}
.vline{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px}
.vline .pill{justify-self:start}
.cyc{display:flex;flex-direction:column;gap:6px}
.cbar{height:5px;background:var(--hero-line);border-radius:3px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--hero-accent)}
/* pendências */
.todo{display:flex;flex-direction:column}
.todo-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.todo-item:last-child{border-bottom:0}
.todo-item:hover .t{text-decoration:underline}
.todo-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.todo .t{font-weight:600;font-size:14px}
/* metas */
.goal{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--raised);border-radius:var(--r);border:1px solid var(--line)}
.goal .vals{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.goal .cur{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--line);border-radius:4px;position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:4px}
.track em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.sig-ok .track i{background:var(--good)} .sig-warn .track i{background:var(--warn)} .sig-bad .track i{background:var(--crit)}
.sig{font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.sig::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sig-ok .sig{color:var(--good)} .sig-warn .sig{color:var(--warn)} .sig-bad .sig{color:var(--crit)} .sig-none .sig{color:var(--faint)}
/* mix */
.mix{display:flex;flex-direction:column;gap:12px}
.mx{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13.5px}
.mx .lab{display:flex;gap:8px;align-items:center;min-width:0}
.mx .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx .tr{height:12px;background:var(--line);border-radius:0 4px 4px 0;position:relative}
.mx .tr i{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0}
.mx .tr em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.mx .v{text-align:right;font-variant-numeric:tabular-nums}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ideia{background:var(--line);color:var(--muted)}
.st-roteiro{background:var(--info-bg);color:var(--info)}
.st-gravacao{background:color-mix(in srgb,var(--p4) 18%,transparent);color:var(--p4)}
.st-edicao{background:var(--warn-bg);color:var(--warn)}
.st-aprovado{background:var(--good-bg);color:var(--good)}
.st-publicado{background:var(--good);color:var(--good-bg)}
.st-agendado{background:color-mix(in srgb,var(--good) 22%,var(--panel));color:var(--good)}
.dc-escalar{background:var(--good-bg);color:var(--good)}
.dc-ajustar{background:var(--warn-bg);color:var(--warn)}
.dc-cortar,.dc-abaixo{background:var(--crit-bg);color:var(--crit)}
.dc-leitura,.dc-sem{background:var(--line);color:var(--muted)}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.tag{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel)}
tr.click td:first-child{border-left:4px solid var(--pc,transparent)}
/* blocos que abrem (Plano) */
details.blk{background:var(--panel);border-radius:var(--r)}
details.blk>summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary .s{display:flex;flex-direction:column;gap:2px;min-width:0}
details.blk>summary::after{content:"+";font-size:20px;color:var(--muted);flex:0 0 auto}
details.blk[open]>summary::after{content:"−"}
details.blk>.in{padding:0 22px 22px;display:flex;flex-direction:column;gap:14px}
.strat dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px 18px;margin:0}
.strat dt{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.strat dd{margin:0;white-space:pre-wrap}
.weight{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.phase{display:flex;gap:6px;flex-wrap:wrap}
.phase span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.phase span.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* calendário */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--raised)}
.seg button{border:0;background:none;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--panel);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;min-width:0}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.dayhead b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.add{border:1px dashed var(--line);background:none;border-radius:var(--r);padding:6px;font-size:13px;color:var(--faint);margin-top:auto}
.add:hover{color:var(--ink);border-color:var(--muted)}
.card{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--pc,var(--line));border-radius:var(--r);padding:9px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;min-width:0}
.card:hover{border-color:var(--muted);border-left-color:var(--pc,var(--muted))}
.card .t{font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .warn{color:var(--warn);font-weight:600}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 4px}
.mcell{background:var(--panel);border-radius:var(--r);min-height:112px;padding:7px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.mcell.out{opacity:.45}
.mcell.today{outline:2px solid var(--accent);outline-offset:-2px}
.mcell .d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;background:var(--raised);border-radius:4px;padding:3px 6px;border:0;border-left:3px solid var(--pc,var(--line));overflow:hidden;white-space:nowrap;width:100%;text-align:left}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip .sd{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:currentColor}
.card.pub,.chip.pub{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.card.pub{border-left-color:var(--good)}.card.pub:hover{border-color:var(--good)}
.card.pub .t,.chip.pub span{color:var(--good)}.card.pub .meta{color:var(--good)}.card.pub .pill.st-publicado,.chip.pub .sd{background:var(--good);color:var(--good-bg)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col .hd{display:flex;justify-content:space-between;align-items:center}
.side{display:flex;flex-direction:column;gap:16px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
/* formulários */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:8px 10px;font-size:14px;font-weight:400;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px}
.checks{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--panel)}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.gate{font-size:13px;color:var(--crit);font-weight:600}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(14,13,11,.55);display:flex;justify-content:flex-end;z-index:50}
.drawer{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.drawer.center{margin:auto;height:auto;max-height:90%;border-radius:var(--r);width:min(520px,calc(100% - 32px))}
.overlay.c{justify-content:center;align-items:center}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
details.sec>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--muted)}
details.sec[open]>summary::after{content:"−"}
/* gráficos */
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px}
.hb .lab{display:flex;gap:7px;align-items:center;min-width:0}
.hb .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:14px;background:var(--line);border-radius:0 4px 4px 0;position:relative}

.rec-bar{position:sticky;top:0;z-index:2;background:var(--hero);border-bottom:1px solid var(--hero-line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.rec-bar .rt{font-size:13px;color:var(--hero-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
.rec-bar .rt b{color:var(--hero-ink);font-weight:600}
.rec .btn{background:transparent;border-color:var(--hero-line);color:var(--hero-ink)}
.rec .btn:hover{border-color:var(--hero-muted)}
.rec .btn.primary{background:var(--hero-accent);border-color:var(--hero-accent);color:#fff}
.rec .seg{background:transparent;border-color:var(--hero-line)}
.rec .seg button{color:var(--hero-muted)}
.rec .seg button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero)}
.rec-prog{height:4px;background:var(--hero-line)}
.rec-prog i{display:block;height:100%;background:var(--good);transition:width .2s}
.rec-body{width:100%;max-width:820px;margin:0 auto;padding:24px 16px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;flex:1 0 auto}
.rec-head{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.rec-head h2{font-size:24px}
.rec .eyebrow{color:var(--hero-muted)}
.rec-box{border:1px solid var(--hero-line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rec-box.hk{border-left:3px solid var(--hero-accent)}
.rec-box ul{margin:0;padding-left:18px}
.rec-lab{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--hero-muted)}
.rseg{border:1px solid var(--hero-line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rseg.done{border-color:var(--good)}
.rseg .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rtime{font-size:12px;font-weight:700;color:var(--hero-accent);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.rfala{font-size:var(--rf);line-height:1.4;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.rfala.nofala{color:var(--hero-muted);font-style:italic;font-size:calc(var(--rf)*.75)}
.rmeta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--hero-muted)}
.rmeta div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:baseline}
.rmeta b{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.rmeta .tela span{color:var(--hero-ink);font-weight:600}
.rck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hero-line);background:transparent;color:var(--hero-muted);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.rck::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor}
.rck[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.rck[aria-pressed="true"]::before{background:var(--good);border-color:var(--good)}
.rec-done{border:1px solid var(--good);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rec-one{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:52vh;cursor:pointer;user-select:none}
.rec-one .rfala{font-size:calc(var(--rf)*1.35);line-height:1.35}
.rec-nav{position:sticky;bottom:0;background:var(--hero);border-top:1px solid var(--hero-line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.rec-nav .row{justify-content:space-between}
.rec-next{font-size:13px;color:var(--hero-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-empty{padding:40px 0;text-align:center;color:var(--hero-muted)}
@media (max-width:560px){.rec{--rf:22px}.rmeta div{grid-template-columns:1fr;gap:0}.rec-head h2{font-size:20px}}

/* app: barra lateral */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:var(--side-ink);padding-block:22px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:10px}
.sb-brand{display:flex;gap:10px;align-items:center;padding:0 6px 8px}
.sb-mark{width:30px;height:30px;border-radius:8px;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.sb-brand b{display:block;font-size:14.5px;line-height:1.2}
.sb-brand span{font-family:var(--mono);font-size:11px;color:var(--side-muted)}
.sb-lab{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--side-muted);padding:10px 8px 2px}
.sb-clients{display:flex;flex-direction:column;gap:2px}
.sbc{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--side-ink);padding:7px 8px;border-radius:8px;text-align:left;min-width:0}
.sbc:hover{background:var(--side-hover)}
.sbc[aria-current="true"]{background:var(--side-hover)}
.sbc .av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;box-shadow:inset 0 0 0 1px var(--side-line);color:var(--side-ink)}
.sbc[aria-current="true"] .av{background:var(--cta);color:var(--cta-ink);box-shadow:none}
.sbc .nm{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.sbc .nm b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbc .nm span{font-size:11.5px;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-add{background:none;border:1px dashed var(--side-line);color:var(--side-muted);border-radius:8px;padding:7px 10px;font-size:13px;text-align:left}
.sb-add:hover{color:var(--side-ink);border-color:var(--side-muted)}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;text-align:left;opacity:.86}
.snav button:hover{background:var(--side-hover);opacity:1}
.snav button[aria-selected="true"]{background:var(--cta);color:var(--cta-ink);opacity:1;font-weight:600}
.snav .ic{width:18px;height:18px;flex:0 0 auto}
.snav .lbl{flex:1}
.sb-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:12px 8px 0;border-top:1px solid var(--side-line)}
.maincol{min-width:0}
.top .hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cyc-chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.pfrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pfc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
.pfc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.nextl{display:flex;flex-direction:column;gap:8px}
.nextl button{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--hero-line);color:var(--hero-ink);padding:6px 0;font-size:14px}
.nextl button:last-child{border-bottom:0}
.nextl .d{font-family:var(--mono);font-size:12px;color:var(--hero-muted)}
.nextl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding-block:12px;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .sb-brand{padding:0}
  .sb-brand div{display:none}
  .sb-lab,.sb-foot{display:none}
  .sb-clients{flex-direction:row;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .sbc{width:auto;padding:4px 8px 4px 4px;flex:0 0 auto}
  .sbc .nm span{display:none}
  .sb-add{padding:6px 10px}
  .snav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);flex-direction:row;gap:0;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-top:1px solid var(--side-line)}
  .snav button{flex:1 1 0;flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;min-width:0;position:relative}
  .snav .lbl{flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .snav .badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;font-size:10px}
  .maincol .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* camada visual: creme, cartões claros, títulos Poppins */
.panel{background:var(--panel);box-shadow:var(--shadow);border-radius:18px}
details.blk{background:var(--panel);box-shadow:var(--shadow);border-radius:18px}
.btn{border-radius:999px;padding:8px 16px;font-weight:600}
.btn.sm{padding:5px 12px}
.app{grid-template-columns:268px minmax(0,1fr)}
.sb{top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:24px;padding-block:24px}
.top{align-items:flex-end}
#h-title{font-size:40px;font-weight:600;letter-spacing:-1.4px;line-height:1.05}
#h-title .hl{background:linear-gradient(transparent 60%,var(--cta) 60%,var(--cta) 92%,transparent 92%);padding:0 4px;margin:0 -4px}
#h-title .cnt{font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:0;vertical-align:super;margin-left:8px;padding:3px 10px;border-radius:999px;background:var(--panel);color:var(--muted);box-shadow:var(--shadow)}
#h-sub{font-size:15px;color:var(--muted);max-width:640px}
.num,.cur,.stat b,.ppnums b,.ab .b,.vs b{font-family:var(--display)}
/* hoje: painel */
.dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.upnext{border-radius:22px;padding:24px;background:linear-gradient(135deg,var(--mint) 0%,var(--mint-2) 55%,var(--panel) 100%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.upnext .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.uchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--ink)}
.uchip .ic{width:14px;height:14px}
.upnext h2{font-size:28px;letter-spacing:-.9px;line-height:1.15}
.upnext .hk{font-size:15px;color:var(--muted);border-left:3px solid var(--cta);padding-left:12px;max-width:620px}
.upnext .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .tp{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stat .si{width:30px;height:30px;border-radius:50%;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stat .si .ic{width:16px;height:16px}
.stat b{font-size:30px;font-weight:500;letter-spacing:-1px;line-height:1}
.stat b small{font-size:15px;color:var(--muted);font-weight:400;margin-left:2px}
.stat .lb{font-size:13px;color:var(--muted)}
.sigp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sigp.ok{background:var(--cta);color:var(--cta-ink)} .sigp.warn{background:var(--warn-bg);color:var(--warn)} .sigp.bad{background:var(--crit-bg);color:var(--crit)} .sigp.none{background:var(--raised);color:var(--muted)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phead h3{font-size:18px}
.agenda{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:78px 4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--raised);border:0;text-align:left;width:100%;color:var(--ink)}
.arow:hover{filter:brightness(.98)}
.arow .when{display:flex;flex-direction:column;line-height:1.2}
.arow .when b{font-family:var(--display);font-size:13px;font-weight:600}
.arow .when span{font-size:11.5px;color:var(--muted)}
.arow .bar{width:4px;height:30px;border-radius:2px;background:var(--pc)}
.arow .tt{display:flex;flex-direction:column;min-width:0}
.arow .tt b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .tt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow.now{background:var(--cta);color:var(--cta-ink)}
.arow.now .when span,.arow.now .tt span{color:var(--cta-ink);opacity:.75}
.arow.past{opacity:.6}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.mcal .h{font-size:11px;color:var(--faint);font-weight:600;padding-bottom:4px}
.mcal button{position:relative;aspect-ratio:1;max-width:100%;border:0;background:none;border-radius:50%;font-family:var(--display);font-size:12.5px;color:var(--ink)}
.mcal button.out{color:var(--faint);opacity:.55}
.mcal button.has::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mcal button.today{background:var(--ink);color:var(--bg)}
.mcal button.today::after{background:var(--cta)}
.mcal button:hover:not(.today){background:var(--raised)}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink)}
.act:last-child{border-bottom:0}
.act .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);cursor:pointer;transition:background .15s,border-color .15s}
.act .ck:hover{border-color:var(--good);background:var(--good-bg)}
.act .ck.on{background:var(--good);border-color:var(--good)}
.act.urg .ck{border-color:var(--crit)}
.act b{font-size:13.5px;font-weight:700;display:block}
.act span.s{font-size:12px;color:var(--muted)}
.act .when{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.vlist{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.vlist div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:baseline}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.dash{grid-template-columns:1fr}}
/* calendário: cabeçalho em pílula e cartões tingidos pelo pilar */
.day{background:var(--panel);box-shadow:var(--shadow);border-radius:16px}
.day.today{outline:0}
.dayhead{background:var(--raised);border-radius:12px;padding:6px 10px;align-items:center}
.day.today .dayhead{background:var(--ink);color:var(--bg)}
.day.today .dayhead .eyebrow{color:var(--bg)}
.day .card{background:color-mix(in srgb,var(--pc) 13%,var(--panel));border:0;border-left:3px solid var(--pc);border-radius:12px}
.day .card:hover{border-left-color:var(--pc);filter:brightness(.98)}
.day .card.pub{background:var(--good-bg);border-left-color:var(--good)}
.mcell{background:var(--panel);box-shadow:var(--shadow);border-radius:12px}
.mcell.today{outline:2px solid var(--ink)}
.phead>.ic{width:20px;height:20px;color:var(--muted)}
@media (max-width:560px){.arow{grid-template-columns:62px 4px minmax(0,1fr);row-gap:4px}.arow>.pill{grid-column:3}.arow .bar{grid-row:span 2}}
@media (max-width:900px){.app{grid-template-columns:1fr}.sb{margin:0;height:auto;border-radius:0;top:0}#h-title{font-size:30px}.upnext h2{font-size:22px}}

/* jornada do ciclo (gamificada) */
.jour{display:flex;flex-direction:column;gap:18px}
.jtop{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:stretch}
.xpbox{background:var(--raised);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lvl b{font-family:var(--display);font-size:22px;letter-spacing:-.6px}
.lvl .xp{font-family:var(--display);font-size:13px;color:var(--muted)}
.xpbar{height:14px;border-radius:999px;background:var(--panel);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--cta));border-radius:999px}
.lticks{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--faint)}
.lticks span.on{color:var(--ink);font-weight:700}
.prize{border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--cta) 0%,color-mix(in srgb,var(--cta) 45%,var(--panel)) 100%);color:var(--cta-ink);display:flex;gap:14px;align-items:center}
.prize .tro{width:52px;height:52px;border-radius:50%;background:var(--cta-ink);color:var(--cta);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.prize .tro .ic{width:28px;height:28px}
.prize b{font-family:var(--display);font-size:15px;display:block}
.prize span{font-size:13px}
.trkw{overflow-x:auto;padding:30px 4px 4px}
.trk{display:grid;gap:0;min-width:640px}
.tn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 4px}
.tn::before,.tn::after{content:"";position:absolute;top:23px;height:6px;margin-top:-3px;background:var(--line);z-index:0}
.tn::before{left:0;right:50%}.tn::after{left:50%;right:0}
.tn:first-child::before,.tn:last-child::after{display:none}
.tn.fl::before,.tn.fr::after{background:var(--accent)}
.tn .cc{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px dashed var(--faint);color:var(--faint)}
.tn .cc .ic{width:22px;height:22px}
.tn.start .cc{background:var(--ink);border:0;color:var(--bg)}
.tn.done .cc{background:var(--good);border:0;color:var(--good-bg)}
.tn.partial .cc{background:var(--warn-bg);border:2px solid var(--warn);color:var(--warn)}
.tn.now .cc{background:var(--cta);border:0;color:var(--cta-ink);box-shadow:0 0 0 7px color-mix(in srgb,var(--cta) 35%,transparent)}
.tn.prz .cc{width:58px;height:58px;margin-top:-6px;border-style:dashed}
.tn.prz.won .cc{background:var(--cta);border:0;color:var(--cta-ink)}
.tn b{font-family:var(--display);font-size:12.5px;font-weight:600}
.tn span{font-size:11.5px;color:var(--muted)}
.here{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:999px;white-space:nowrap;z-index:2}
.jbot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.mis{display:flex;flex-direction:column;gap:10px}
.mi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.mi .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center}
.mi.ok .ck{background:var(--good);border-color:var(--good);color:var(--good-bg)}
.mi.ok .ck .ic{width:14px;height:14px}
.mi .mb{height:5px;border-radius:3px;background:var(--raised);margin-top:4px;overflow:hidden}

<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const ALL_STATUSES=[["ideia","Ideia"],["roteiro","Roteiro"],["gravacao","Gravação"],["edicao","Edição"],["aprovado","Aprovado"],["agendado","Agendado"],["publicado","Publicado"]];
const OBJS=[["atracao","Atração","globe"],["autoridade","Autoridade","star"],["conversao","Conversão","target"]];
const OBJN=Object.fromEntries(OBJS.map(o=>[o[0],o[1]]));
const TESTV=[["gancho","Gancho"],["formato","Formato"],["publico","Público"],["tema","Tema"],["horario","Horário"],["cta","Chamada (CTA)"]];
const LSTAGES=[["novo","Novo contato"],["conversa","Em conversa"],["proposta","Proposta enviada"],["fechado","Fechado"],["perdido","Perdido"]];
function seriesBase(x){return String(x||"").split(" · ")[0].trim()}
function seriesEp(x){const m_=String(x||"").match(/ep\.?\s*(\d+)/i);return m_?Number(m_[1]):null}
function kwOf(p){if(p.keyword)return String(p.keyword).trim().toUpperCase();const m_=String(p.caption||"").match(/comenta\s+([A-ZÁÉÍÓÚÃÕÇ]{3,})/);return m_?m_[1]:""}
function kwList(c){return String(c.keywords||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [w,...r]=l.split(":");return {word:w.trim().toUpperCase(),delivers:r.join(":").trim()}}).filter(k=>k.word)}
function brl(v){return v==null?"–":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0})}
function median(a){const v=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!v.length)return null;const h=Math.floor(v.length/2);return v.length%2?v[h]:(v[h-1]+v[h])/2}
const ST=Object.fromEntries(ALL_STATUSES);
const FORMATS=["Reel","Carrossel","Post","Stories"];
const DAYS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const DSHORT=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const PHASES=["Briefing","Diagnóstico do perfil","Mercado","Leitura estratégica","Posicionamento","Plano editorial","Produção","Medição"];
const DEFAULT_CHECKS=["Funciona sem som, só pelo texto na tela?","Cria uma lacuna que só se fecha assistindo até o fim?","Fala com uma pessoa específica, não com todo mundo?","Soa como conversa com uma amiga, não como anúncio?","Dá motivo concreto para mandar para alguém ou salvar?"];
const PMETRICS=[
 ["views","Views"],["reach","Contas alcançadas"],["nonFollowersPct","Views de não seguidores (%)"],["likes","Curtidas"],["comments","Comentários"],
 ["saves","Salvamentos"],["shares","Compartilhamentos"],["ret3s","Retenção (%)"],["avgWatch","Tempo médio (s)"],
 ["follows","Seguidores ganhos"],["profileVisits","Visitas ao perfil"],["linkClicks","Cliques no link"],["dms","DMs / leads"]
];
const PM=Object.fromEntries(PMETRICS);
const SMETRICS=[
 ["followers","Seguidores"],["views","Visualizações"],["uniqueViewers","Visualizadores únicos"],["nonFollowersPct","Views de não seguidores (%)"],
 ["interactions","Interações"],["interactionsFollowersPct","Interações de seguidores (%)"],["storiesPct","Interações em stories (%)"],
 ["postsPct","Interações em posts (%)"],["reelsPct","Interações em reels (%)"],["engagedAccounts","Contas com engajamento"],
 ["profileVisits","Visitas ao perfil"],["followsGained","Seguidores ganhos"],["followsLost","Seguidores perdidos"],["linkClicks","Cliques no link"]
];
const HYP_METRICS=[["views","Views"],["nonFollowersPct","Não seguidores (%)"],["shares","Compartilhamentos"],["saves","Salvamentos"],["ss","Compart. + salv."],["ret3s","Retenção (%)"],["follows","Seguidores ganhos"]];
const HYP_FIELDS=[["pillar","Pilar"],["format","Formato"],["series","Série"],["hookType","Técnica do gancho"]];
const nz=v=>(v===null||v===undefined||v===""||isNaN(Number(v)))?null:Number(v);
const GOAL_FIELDS={
 followsGained:{label:"Seguidores ganhos",src:"snap",unit:"n",get:s=>nz(s.followsGained)},
 followsLost:{label:"Seguidores perdidos",src:"snap",unit:"n",get:s=>nz(s.followsLost)},
 netFollowers:{label:"Saldo de seguidores",src:"snap",unit:"n",get:s=>(nz(s.followsGained)!=null&&nz(s.followsLost)!=null)?s.followsGained-s.followsLost:null},
 conversion:{label:"Conversão visita em seguidor",src:"snap",unit:"%",get:s=>(nz(s.profileVisits)&&nz(s.followsGained)!=null)?s.followsGained/s.profileVisits*100:null},
 nonFollowersPct:{label:"Views de não seguidores",src:"snap",unit:"%",get:s=>nz(s.nonFollowersPct)},
 reelsPct:{label:"Interações vindas de reels",src:"snap",unit:"%",get:s=>nz(s.reelsPct)},
 followers:{label:"Seguidores",src:"snap",unit:"n",get:s=>nz(s.followers)},
 postViews:{label:"Views médias por reel",src:"posts",unit:"n",get:ps=>avg(ps.map(p=>m(p,"views")))},
 postNonFollowers:{label:"Não seguidores por reel",src:"posts",unit:"%",get:ps=>avg(ps.map(p=>m(p,"nonFollowersPct")))},
 sharesSaves:{label:"Compart. e salvamentos por reel",src:"posts",unit:"n",get:ps=>avg(ps.map(p=>val(p,"ss")))},
 ret3s:{label:"Retenção dos reels",src:"posts",unit:"%",get:ps=>avg(ps.map(p=>m(p,"ret3s")))}
};
const DEFAULT_GOALS=()=>[
 {id:gid(),field:"followsGained",base:null,target:null,direction:"up",note:""},
 {id:gid(),field:"nonFollowersPct",base:null,target:null,direction:"up",note:""},
 {id:gid(),field:"conversion",base:null,target:null,direction:"up",note:""},
 {id:gid(),field:"sharesSaves",base:null,target:null,direction:"up",note:"Medir nas semanas 1 e 2 e usar como base"}
];

/* ---------- estado ---------- */
const S={pf:"",leads:[],prompts:[],avPick:false,db:null,sample:null,imgLimits:null,clients:[],clientId:null,posts:[],snaps:[],analyses:[],tab:"hoje",calView:"week",anchor:today(),editStrategy:false,editReview:false,openPaste:false,hooks:[],hw:null,ref:null,stories:[],editStories:false,unsubs:[],loaded:false,draft:null};
try{const t=localStorage.getItem("cc_tab2");if(["hoje","plano","producao","biblioteca","stories","ganchos","prompts","resultados"].includes(t))S.tab=t;const v=localStorage.getItem("cc_cal");if(["week","month","board"].includes(v))S.calView=v;}catch(e){}

/* ---------- utilidades ---------- */
function gid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function m(p,k){return nz(p.metrics&&p.metrics[k])}
function val(p,k){if(k==="ss"){const a=m(p,"shares"),b=m(p,"saves");return(a==null&&b==null)?null:(a||0)+(b||0)}return m(p,k)}
function avg(arr){const v=arr.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function fmt(v,unit,dec){if(v==null)return "–";if(unit==="%")return v.toLocaleString("pt-BR",{maximumFractionDigits:dec??1})+"%";return Math.round(v).toLocaleString("pt-BR")}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parse(s){if(!s)return null;const [y,mo,d]=s.split("-").map(Number);return new Date(y,mo-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dmy(s){const d=parse(s);return d?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"):"Sem data"}
function wd(s){const d=parse(s);return d?DSHORT[(d.getDay()+6)%7]:""}
function daysBetween(a,b){return Math.round((b-a)/864e5)}
function client(){return S.clients.find(c=>c.id===S.clientId)||null}
function statuses(c){return ALL_STATUSES.filter(([k])=>k!=="aprovado"||(c&&c.useApproval))}
function sIdx(k){return ALL_STATUSES.findIndex(x=>x[0]===k)}
function pillarColor(c,name){if(!c||!c.pillars)return "var(--line)";const i=c.pillars.findIndex(p=>p.name===name);return i<0?"var(--line)":"var(--p"+((i%5)+1)+")"}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function stPill(s){return `<span class="pill st-${esc(s)}">${esc(ST[s]||s)}</span>`}
function cycle(c){return {st:parse(c&&c.cycle&&c.cycle.start),en:parse(c&&c.cycle&&c.cycle.end)}}
function inCycle(c,dateStr){const {st,en}=cycle(c);const d=parse(dateStr);if(!d)return false;if(st&&d<st)return false;if(en&&d>en)return false;return true}
function cycleProgress(c){const {st,en}=cycle(c);if(!st||!en)return null;const total=daysBetween(st,en)+1;const day=daysBetween(st,today())+1;return {total,day,frac:Math.max(0,Math.min(1,day/total)),started:day>=1,startsIn:1-day}}
function publishedReels(c){return S.posts.filter(p=>p.status==="publicado"&&p.format==="Reel"&&inCycle(c,p.date))}
function baseSnap(){return S.snaps.find(x=>x.isBaseline||x.kind==="base")||null}
function latestSnap(){return S.snaps.filter(x=>!(x.isBaseline||x.kind==="base")).sort((a,b)=>(b.periodEnd||"").localeCompare(a.periodEnd||""))[0]||null}
function checks(c){return (c&&c.hookChecks&&c.hookChecks.length)?c.hookChecks:DEFAULT_CHECKS}
function checksDone(c,p){const n=checks(c).length;const v=p.hookChecks||[];return v.filter(Boolean).length>=n}
function needsGate(p){return false}
function win(c){return nz(c&&c.criteria&&c.criteria.windowDays)||7}

/* ---------- capacidades ---------- */
async function boot(){
  render();
  const cl=window.claude;
  if(!cl||!cl.use){showNotice("Não foi possível carregar o banco de dados. Recarregue a página.");S.loaded=true;render();return}
  const [db,sample]=await Promise.all([cl.use("db").catch(()=>null),cl.use("sample").catch(()=>null)]);
  S.db=db;S.sample=sample;
  if(sample)sample.limits().then(l=>{S.imgLimits=l&&l.images?l.images:null;render()}).catch(()=>{});
  if(!db){showNotice("Banco de dados não configurado ou sem conexão. Recarregue a página.");S.loaded=true;render();return}
  db.collection("hooks").onSnapshot(s=>{S.hooks=s.docs.map(d=>({id:d.id,...d.data()}));rerender()},()=>{});
  db.collection("prompts").onSnapshot(s=>{S.prompts=s.docs.map(d=>({id:d.id,...d.data()}));rerender()},()=>{});
  db.collection("clients").onSnapshot(snap=>{
    S.clients=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
    let saved=null;try{saved=localStorage.getItem("cc_client")}catch(e){}
    if(!S.clientId||!S.clients.some(c=>c.id===S.clientId)){const pick=S.clients.find(c=>c.id===saved)||S.clients[0];if(pick)selectClient(pick.id,true)}
    S.loaded=true;if(!S.editStrategy&&!S.editReview)render();
  },e=>showNotice("Não foi possível carregar os clientes ("+e.code+"). Recarregue a página."));
}
function showNotice(t){const n=document.getElementById("notice");n.textContent=t;n.hidden=false}
function selectClient(id,silent){
  S.clientId=id;S.editStrategy=false;S.editReview=false;S.draft=null;try{localStorage.setItem("cc_client",id)}catch(e){}
  S.unsubs.forEach(u=>u());S.unsubs=[];S.stories=[];storyGen=null;S.editStories=false;S.posts=[];S.snaps=[];S.analyses=[];
  const db=S.db;let first=true;
  S.unsubs.push(db.collection("posts").where("clientId","==",id).onSnapshot(s=>{S.posts=s.docs.map(d=>({id:d.id,...d.data()}));
    if(first&&!s.metadata.fromCache){first=false;const c=client();const st=parse(c&&c.cycle&&c.cycle.start);const ws=monday(today());if(st&&st>addDays(ws,6)&&!S.posts.some(p=>{const d=parse(p.date);return d&&d>=ws&&d<=addDays(ws,6)}))S.anchor=st}
    rerender()}));
  S.leads=[];S.unsubs.push(db.collection("leads").where("clientId","==",id).onSnapshot(s=>{S.leads=s.docs.map(d=>({id:d.id,...d.data()}));rerender()},()=>{}));
  S.unsubs.push(db.collection("stories").where("clientId","==",id).onSnapshot(s=>{S.stories=s.docs.map(d=>({id:d.id,...d.data()}));rerender()}));
  S.unsubs.push(db.collection("snapshots").where("clientId","==",id).onSnapshot(s=>{S.snaps=s.docs.map(d=>({id:d.id,...d.data()}));rerender()}));
  S.unsubs.push(db.collection("analyses").where("clientId","==",id).onSnapshot(s=>{S.analyses=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));rerender()}));
  if(!silent)render();
}
function rerender(){if(S.editStrategy||S.editReview||S.editStories||(S.tab==="prompts"&&ptEdit))return;if(S.tab==="resultados")readDraft();if(S.tab==="ganchos")readHW();render()}
async function save(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){toast(e&&e.code==="quota_exceeded"?"Limite de registros atingido. Apague itens antigos.":"Não foi possível salvar. Tente de novo.");return false}}

/* ---------- regras de decisão ---------- */
function decisions(c){
  const cr=c.criteria||{};const mult=nz(cr.scaleMult)||2,nfT=nz(cr.scaleNonFollowers)||50,streak=nz(cr.cutStreak)||3,w=win(c);
  const pub=S.posts.filter(p=>p.status==="publicado"&&inCycle(c,p.date)&&m(p,"views")!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const byFmt={};pub.forEach(p=>{(byFmt[p.format]=byFmt[p.format]||[]).push(p)});
  const avgOf=(arr,k)=>avg((arr||[]).map(p=>val(p,k)));
  const res={};const cutFormats=[];
  Object.entries(byFmt).forEach(([f,arr])=>{const av=avgOf(arr,"views");const last=arr.slice(-streak);if(arr.length>=streak*2&&last.every(p=>m(p,"views")<av*0.8))cutFormats.push(f)});
  const reels=pub.filter(p=>p.format==="Reel");const avSh=avgOf(reels,"shares"),avRt=avgOf(reels,"ret3s");const allAv=avgOf(pub,"views");
  pub.forEach(p=>{
    const age=daysBetween(parse(p.date),today());const fAv=avgOf(byFmt[p.format],"views")||allAv;const v=m(p,"views");const nf=m(p,"nonFollowersPct");
    let k="sem",l="Sem referência";
    if(age<w){k="leitura";l="Em leitura ("+(w-age)+" d)"}
    else if((fAv&&v>=mult*fAv)||(nf!=null&&nf>nfT)){k="escalar";l="Escalar"}
    else if(cutFormats.includes(p.format)&&v<fAv){k="cortar";l="Cortar formato"}
    else if(fAv&&v>=fAv*0.8&&((avSh!=null&&m(p,"shares")!=null&&m(p,"shares")<avSh)||(avRt!=null&&m(p,"ret3s")!=null&&m(p,"ret3s")<avRt))){k="ajustar";l="Ajustar gancho"}
    else if(fAv&&v<fAv*0.8){k="abaixo";l="Abaixo da média"}
    else if(fAv){k="leitura";l="Na média"}
    res[p.id]={k,l};
  });

function goalState(c,g){
  const f=GOAL_FIELDS[g.field];if(!f)return null;
  let cur=null,from="";
  if(f.src==="snap"){const s=latestSnap();if(s){cur=f.get(s);from=s.label||("até "+dmy(s.periodEnd))}}
  else{const ps=publishedReels(c).filter(p=>m(p,"views")!=null);cur=f.get(ps);from=ps.length+" reels com métrica"}
  const base=nz(g.base),target=nz(g.target);let pct=null,done=false;
  if(cur!=null&&target!=null){
    if(g.direction==="down"){pct=base!=null&&base!==target?(base-cur)/(base-target):(cur<=target?1:0);done=cur<=target}
    else{pct=base!=null&&base!==target?(cur-base)/(target-base):cur/target;done=cur>=target}
    pct=Math.max(0,Math.min(1,pct));
  }
  const cp=cycleProgress(c);const exp=cp&&cp.started?cp.frac:0;
  let sig="none",sigL=target==null?"Meta a definir":cur==null?"Sem dados":"";
  if(pct!=null){if(done||pct>=exp-0.1){sig="ok";sigL=done?"Meta atingida":"No ritmo"}else if(pct>=exp-0.3){sig="warn";sigL="Atenção"}else{sig="bad";sigL="Em risco"}}
  return {f,cur,from,base,target,pct,done,sig,sigL,exp};
}
function goalCard(c,g){
  const s=goalState(c,g);if(!s)return "";
  const tgt=s.target==null?"Meta a definir":(g.direction==="down"?"Meta: abaixo de ":"Meta: ")+fmt(s.target,s.f.unit);
  return `<div class="goal sig-${s.sig}">
    <div class="row between"><p class="small muted">${esc(s.f.label)}</p><span class="sig">${esc(s.sigL)}</span></div>
    <div class="vals"><span class="cur">${fmt(s.cur,s.f.unit)}</span><span class="small muted num">${tgt}</span></div>
    <div class="track" role="img" aria-label="Progresso ${s.pct==null?"sem dados":Math.round(s.pct*100)+"%"}, ritmo esperado ${Math.round(s.exp*100)}%"><i style="width:${s.pct==null?0:Math.round(s.pct*100)}%"></i>${s.exp>0?`<em style="left:calc(${(s.exp*100).toFixed(1)}% - 1px)" title="Ritmo esperado para hoje"></em>`:""}</div>
    <p class="small faint">Base ${fmt(s.base,s.f.unit)} · ${s.cur==null?(s.f.src==="snap"?"cole o print do perfil do ciclo":"cole as métricas dos reels"):esc(s.from)}${g.note?" · "+esc(g.note):""}</p>
  </div>`;
}

  const dots=posts.map(p=>{const d=parse(p.date);const sameDay=posts.filter(q=>q.date===p.date);const k=sameDay.indexOf(p);const x=X(d)+(k-(sameDay.length-1)/2)*12;const v=m(p,"views");const r=v!=null&&av?Math.max(6,Math.min(13,6+5*(v/av-1)+3)):6;const pc=pillarColor(c,p.pillar);const pubd=p.status==="publicado";

  const today_=`<g><line x1="${tx}" x2="${tx}" y1="${y0-44}" y2="${y0+56}" class="tl"/><rect x="${tx-24}" y="${y0-60}" width="48" height="18" rx="9" class="tb"/><text x="${tx}" y="${y0-47}" text-anchor="middle" class="tt">Hoje</text></g>`;

    ${[["users","Público prioritário",c.audience],["pin","Território",c.territory],["tag","Oferta",c.offer],["chat","Tom de voz",c.tone]].map(([icn,k,v])=>`<div class="irow"><span class="ii">${ic(icn)}</span><div><span class="eyebrow">${k}</span><p>${txt(v)}</p></div></div>`).join("")}</div></section>`;
  /* funil */
  const shade=k=>`color-mix(in srgb,var(--accent) ${Math.max(14,48-k*10)}%,var(--panel))`;
  const fun=steps.length?`<section class="panel s5"><div class="phead">${sh("route","Caminho do perfil","Da descoberta à contratação")}</div><div class="funnel">${steps.map((st_,k)=>{const [h,...r]=st_.split(":");return `<div class="fs" style="width:${100-k*(40/Math.max(1,steps.length-1))}%;background:${shade(k)}"><b>${esc(h)}</b><span>${esc(r.join(":").trim())}</span></div>`}).join("")}</div></section>`:"";
  /* mercado */
  const mult=r=>{const x=String(r.outlier||"").match(/\(([\d.,]+)\s*x\)/i);return x?parseFloat(x[1].replace(",",".")):null};
  const mx=Math.max(1,...R.map(r=>mult(r)||0));
  const mer=`<section class="panel ${fun?"s7":"s12"}"><div class="phead">${sh("market","Mercado",R.length+" referências · quanto o melhor post superou o tamanho da conta")}</div>
    ${R.length?`<div>${R.map(r=>{const k=mult(r);return `<div class="mref"><div><b>${esc(r.handle)}</b><div class="sm">${esc([r.followers,r.territory].filter(Boolean).join(" · "))}</div></div><div><div class="obar"><i style="width:${k?Math.max(4,k/mx*100):0}%"></i></div><div class="sm">${esc(r.format||"")}</div></div><span class="x">${k?k.toLocaleString("pt-BR")+"x":"–"}</span></div>`}).join("")}</div>`:`<p class="muted">Nenhuma referência.</p>`}
    ${pat.length?`<div><span class="eyebrow">O que se repete no nicho</span><div class="pats">${pat.map(l=>`<span>${esc(l)}</span>`).join("")}</div></div>`:""}</section>`;
  /* mapa do público */
  const AM=c.audienceMap||{};const lines=x=>String(x||"").split("\n").map(s=>s.trim().replace(/^[-•]\s*/,"")).filter(Boolean);
  const amCols=[["alert","Dores","pains"],["lock","Objeções","objections"],["check","Precisa entender antes de confiar","trust"],["route","Comportamentos e contradições","contradictions"],["chat","Palavras que o público usa","language"]];
  const amHas=amCols.some(x=>lines(AM[x[2]]).length);
  const mapa=`<section class="panel s12"><div class="phead">${sh("users","Mapa do público","Alimenta os ganchos, roteiros e stories gerados pela IA")}</div>
    ${amHas?`<div class="amap">${amCols.map(([icn,l,k])=>`<div class="amc"><div class="th"><span class="ico sm">${ic(icn)}</span><b>${l}</b></div>${lines(AM[k]).length?(k==="language"?`<div class="pats">${lines(AM[k]).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:`<ul class="clean">${lines(AM[k]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`):'<p class="small faint">A definir</p>'}</div>`).join("")}</div>`:`<div class="empty">Ainda não preenchido. Em Editar plano, liste as dores, objeções, o que o público precisa entender antes de confiar, as contradições e as palavras que ele usa.</div>`}</section>`;
  /* objetivos */
  const OM=c.objMix||{};const cps2=S.posts.filter(p=>inCycle(c,p.date)&&p.format!=="Stories");const n2=cps2.length||1;
  const objp=`<section class="panel s5"><div class="phead">${sh("target","Objetivos do ciclo","Quanto de cada objetivo o calendário deveria ter")}</div><div class="plist">${OBJS.map(([k,l,icn])=>{const real=cps2.filter(p=>p.objective===k).length/n2*100;const want=nz(OM[k]);return `<div class="pl1"><div class="row1"><b><span class="odot o-${k}"></span> ${l}</b><span class="w">${want!=null?want+"%":"–"}</span></div><div class="pvr"><span class="rl o-${k}" style="width:${Math.min(100,real).toFixed(1)}%"></span>${want!=null?`<span class="pl" style="left:calc(${Math.min(100,want)}% - 1px)"></span>`:""}</div><span class="d">no calendário: ${Math.round(real)}%</span></div>`}).join("")}<span class="small muted">${cps2.filter(p=>!p.objective).length} pauta(s) do ciclo sem objetivo. Barra = calendário · traço = meta.</span></div></section>`;
  /* séries */
  const sb={};S.posts.filter(p=>p.series).forEach(p=>{const b=seriesBase(p.series);(sb[b]=sb[b]||[]).push(p)});
  const sers=Object.entries(sb).map(([b,arr])=>{const pubd=arr.filter(p=>p.status==="publicado");const v=avg(pubd.map(p=>m(p,"views")));const nx=arr.filter(p=>p.date&&p.date>=iso(today())&&p.status!=="publicado").sort((x,y)=>x.date.localeCompare(y.date))[0];const eps=arr.map(p=>seriesEp(p.series)).filter(x=>x!=null);return {b,n:arr.length,pub:pubd.length,v,nx,last:eps.length?Math.max(...eps):null}}).sort((x,y)=>y.n-x.n);
  const serp=`<section class="panel s7"><div class="phead">${sh("list","Séries","Formatos recorrentes do calendário e como estão indo")}</div>${sers.length?`<div class="tbl-wrap"><table><thead><tr><th>Série</th><th class="n">Pautas</th><th class="n">No ar</th><th class="n">Views médias</th><th>Próxima</th></tr></thead><tbody>${sers.map(x=>`<tr><td><b>${esc(x.b)}</b>${x.last?`<div class="small muted">último: ep. ${x.last}</div>`:""}</td><td class="n">${x.n}</td><td class="n">${x.pub}</td><td class="n">${fmt(x.v)}</td><td>${x.nx?`<button class="btn sm ghost" data-post="${esc(x.nx.id)}">${wd(x.nx.date)} ${dmy(x.nx.date)}</button>`:'<span class="small faint">sem data</span>'}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Nenhuma série ainda. Preencha o campo Série nas pautas.</p>`}</section>`;
  /* provas e palavras-chave */
  const pr=lines(c.proofs);
  const prov=`<section class="panel s6"><div class="phead">${sh("star","Banco de provas","Números, bastidores e resultados que sustentam a autoridade")}</div>${pr.length?`<div>${pr.map(x=>`<div class="irow g"><span class="ii">${ic("check")}</span><p>${esc(x)}</p></div>`).join("")}</div>`:`<p class="muted">Nenhuma prova registrada. Adicione em Editar plano: um resultado, um antes e depois, um depoimento por linha.</p>`}</section>`;
  const KW=kwList(c);const kwUse=k=>S.posts.filter(p=>kwOf(p)===k).length;const kwLeads=k=>S.leads.filter(l=>String(l.keyword||"").toUpperCase()===k).length;
  const kwp=`<section class="panel s6"><div class="phead">${sh("tag","Palavras-chave","O que cada chamada \"comenta X\" entrega e quanto gerou")}</div>${KW.length?`<div class="tbl-wrap"><table><thead><tr><th>Palavra</th><th>Entrega</th><th class="n">Pautas</th><th class="n">Leads</th></tr></thead><tbody>${KW.map(k=>`<tr><td><b>${esc(k.word)}</b></td><td>${k.delivers?esc(k.delivers):'<span class="warnt">definir entrega</span>'}</td><td class="n">${kwUse(k.word)}</td><td class="n">${kwLeads(k.word)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Nenhuma palavra-chave. Adicione em Editar plano, uma por linha: PALAVRA: o que a pessoa recebe.</p>`}</section>`;
  return `<div class="stack plan" style="gap:16px">
  <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="edit-strategy">Editar plano</button></div>
  <div class="pd">${pos}${cyc}${metas}${mapa}${objp}${pil}${sem}${serp}${diag}${est}${prov}${kwp}${fun}${mer}</div>
  </div>`;
}

function vProducao(c){
  const a=S.anchor;let title="",body;
  if(S.calView==="week"){
    const ws=monday(a);const we=addDays(ws,6);
    title=`${ws.getDate()} de ${MONTHS[ws.getMonth()]} a ${we.getDate()} de ${MONTHS[we.getMonth()]}`;
    body=`<div class="week">${[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i);const ds=iso(d);const ps=S.posts.filter(p=>p.date===ds&&pfOk(p)).sort((x,y)=>(x.time||"").localeCompare(y.time||""));const g=(c.grid||[]).find(x=>x.day===DAYS[i]);
      const dts=(c.dates||[]).filter(x=>x.date===ds);
      return `<div class="day${ds===iso(today())?" today":""}"><div class="dayhead"><span class="eyebrow">${DSHORT[i]}</span><b>${d.getDate()}</b></div>${dts.map(dateChip).join("")}${g?`<p class="small faint">${esc(g.format||"Livre")}${g.focus?" · "+esc(g.focus):""}</p>`:""}${ps.map(p=>postCard(c,p)).join("")}<button class="add" data-new="${ds}">+ Pauta</button></div>`}).join("")}</div>`;
  }else if(S.calView==="month"){
    const first=new Date(a.getFullYear(),a.getMonth(),1);const start=monday(first);
    title=`${MONTHS[a.getMonth()]} de ${a.getFullYear()}`;title=title[0].toUpperCase()+title.slice(1);
    let cells="";for(let i=0;i<42;i++){const d=addDays(start,i);const ds=iso(d);const ps=S.posts.filter(p=>p.date===ds&&pfOk(p));
      cells+=`<div class="mcell${d.getMonth()!==a.getMonth()?" out":""}${ds===iso(today())?" today":""}" data-new="${ds}" role="button" tabindex="0" aria-label="${d.getDate()} de ${MONTHS[d.getMonth()]}, ${ps.length} pautas"><span class="d">${d.getDate()}</span>${(c.dates||[]).filter(x=>x.date===ds).map(dateChip).join("")}${ps.map(p=>`<button class="chip${p.status==="publicado"?" pub":""}" data-post="${esc(p.id)}" style="--pc:${pillarColor(c,p.pillar)}" title="${esc((p.title||"")+" · "+(ST[p.status]||""))}"><i class="sd st-${esc(p.status)}"></i><span>${esc(p.title||"Sem título")}</span></button>`).join("")}</div>`;
      if(i===34&&addDays(start,35).getMonth()!==a.getMonth())break;}
    body=`<div class="month">${DSHORT.map(d=>`<span class="mh">${d}</span>`).join("")}${cells}</div>`;
  }else{
    title="Quadro de produção";
    const t=iso(addDays(today(),-14));
    const ps=S.posts.filter(p=>p.date&&p.date>=t&&pfOk(p)).sort((x,y)=>(x.date+(x.time||"")).localeCompare(y.date+(y.time||"")));
    const sts=statuses(c);
    body=`<div class="board">${sts.map(([k,l])=>{const col=ps.filter(p=>p.status===k||(k==="edicao"&&p.status==="aprovado"&&!c.useApproval));return `<div class="col"><div class="hd">${stPill(k)}<b class="num small">${col.length}</b></div>${col.map(p=>postCard(c,p,true)).join("")||'<p class="small faint">Vazio</p>'}</div>`}).join("")}</div><p class="small muted">Pautas das últimas 2 semanas em diante. Use a coluna Roteiro para montar o lote de gravação.</p>`;
  }
  const nav=S.calView!=="board"?`<button class="btn sm" data-cal="prev" aria-label="Anterior">‹</button><button class="btn sm" data-cal="today">Hoje</button><button class="btn sm" data-cal="next" aria-label="Próximo">›</button>`:"";

function capOf(c){const m_=String(c.capacity||"").match(/(\d+)\s*(conte|post|pauta)/i);return m_?Number(m_[1]):1}
function coherence(c,rs,re){
  const ps=S.posts.filter(p=>p.date&&p.date>=rs&&p.date<=re&&p.format!=="Stories").sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  const out=[];const cap=capOf(c);
  const byDay={};ps.forEach(p=>{(byDay[p.date]=byDay[p.date]||[]).push(p)});
  Object.entries(byDay).forEach(([d,arr])=>{if(arr.length>cap)out.push({lv:"warn",t:`${wd(d)} ${dmy(d)} tem ${arr.length} pautas e a capacidade é ${cap} por dia`,post:arr[1].id})});
  const run=(key,label)=>{let k=1;for(let i=1;i<ps.length;i++){const v=ps[i][key];if(v&&v===ps[i-1][key]){k++;if(k===3)out.push({lv:"info",t:`3 pautas seguidas com o mesmo ${label}: ${v}`,post:ps[i].id})}else k=1}};
  run("pillar","pilar");run("hookType","tipo de gancho");
  const noObj=ps.filter(p=>!p.objective&&p.status!=="publicado");if(noObj.length)out.push({lv:"info",t:`${noObj.length} pauta${noObj.length>1?"s":""} sem objetivo definido (atração, autoridade ou conversão)`,post:noObj[0].id});
  const weeks={};ps.forEach(p=>{const w=iso(monday(parse(p.date)));(weeks[w]=weeks[w]||[]).push(p)});
  Object.entries(weeks).forEach(([w,arr])=>{if(arr.length>=3&&arr.some(p=>p.objective)&&!arr.some(p=>p.objective==="conversao"))out.push({lv:"warn",t:`Semana de ${dmy(w)} sem nenhum conteúdo de conversão`})});
  const known=kwList(c).filter(k=>k.delivers).map(k=>k.word);const used={};ps.forEach(p=>{const k=kwOf(p);if(k)(used[k]=used[k]||[]).push(p)});
  Object.entries(used).forEach(([k,arr])=>{if(!known.includes(k))out.push({lv:"warn",t:`Palavra-chave ${k} sem entrega definida no Plano (${arr.length} pauta${arr.length>1?"s":""})`,post:arr[0].id})});
  const sers={};S.posts.filter(p=>p.date&&seriesEp(p.series)!=null).forEach(p=>{(sers[seriesBase(p.series)]=sers[seriesBase(p.series)]||[]).push(p)});
  Object.entries(sers).forEach(([b,arr])=>{arr.sort((x,y)=>x.date.localeCompare(y.date));for(let i=1;i<arr.length;i++){if(seriesEp(arr[i].series)<=seriesEp(arr[i-1].series)){out.push({lv:"warn",t:`Série "${b}": o ep. ${seriesEp(arr[i].series)} vem depois do ep. ${seriesEp(arr[i-1].series)}`,post:arr[i].id});break}}});
  return {list:out,ps};
}

function designBrief(c,p){
  const fmt=p.format;const lines=String(p.script||"").split("\n").map(x=>x.trim()).filter(Boolean);
  const clean=l=>l.replace(/^\d+\s*[·.)-]\s*/,"").replace(/^(slide\s*\d+\s*(\([^)]*\))?\s*[:·-]\s*)/i,"").replace(/^(capa|cta|fechamento)\s*[:·-]\s*/i,"");
  const label=(l,i,n)=>{const m=l.match(/^\d+\s*·\s*(capa|cta)\b/i)||l.match(/\((capa|cta)[^)]*\)/i)||l.match(/^(capa|cta|fechamento)\b/i);return m?m[1].toLowerCase():(i===0?"capa":i===n-1?"fechamento":"")};
  const star=(p.hooks||"").split("\n").find(l=>l.includes("★"))||"";const hook=(star.match(/"([^"]+)"/)||[])[1]||"";
  const visual=(String(p.notes||"").split("\n").find(l=>/^visual/i.test(l))||"").replace(/^visual:\s*/i,"");
  const extra=(String(p.notes||"").split("\n").find(l=>/^(fotos|imagem)/i.test(l))||"");
  const out=[];
  out.push((fmt==="Carrossel"?"BRIEFING DE CARROSSEL":"BRIEFING DE POST ESTÁTICO")+" · Instagram");
  out.push("Perfil: "+(c.handle||c.name)+(p.pillar?" · Pilar: "+p.pillar:"")+(p.trigger?" · Objetivo: "+p.trigger:""));
  out.push("Tema: "+(p.title||""));
  out.push("Formato: "+(fmt==="Carrossel"?lines.length+" slides":"1 imagem")+", 1080 x 1350 px (4:5, vertical)");
  out.push("");
  out.push("DIREÇÃO VISUAL");
  if(visual)out.push("- "+visual);
  if(extra)out.push("- "+extra);
  out.push("- Estética do perfil: "+(first((c.diagnosis&&c.diagnosis.grid)||"")||"lifestyle com luz natural e tons quentes"));
  out.push("- Fotos reais de rotina como fundo, sem banco de imagens genérico.");
  out.push("- Texto principal curto e grande, em destaque; texto de apoio em linha menor.");
  out.push("- Manter todo texto dentro da área segura (margem de 120 px nas bordas).");
  out.push("- Mesma tipografia, tamanho e posição em todos os slides. Sem emojis na arte.");
  out.push("");
  out.push("REGRAS DE TEXTO");
  out.push("- Usar o texto exatamente como escrito abaixo, sem reescrever, resumir ou acrescentar frases.");
  out.push("- Principal é o texto em destaque do slide; Apoio é o texto menor, na mesma arte.");
  out.push("- Itens entre [colchetes] são para preencher depois: manter os colchetes.");
  out.push("");
  out.push(fmt==="Carrossel"?"SLIDES":"ARTE");
  if(fmt==="Carrossel"){lines.forEach((l,i)=>{const lb=label(l,i,lines.length);const parts=clean(l).split(/\s+·\s+/).filter(Boolean);out.push("Slide "+(i+1)+(lb?" ("+lb+")":"")+":");out.push("  Principal: "+(parts[0]||""));if(parts.length>1)out.push("  Apoio: "+parts.slice(1).join(" / "))})}
  else{const img=lines.find(l=>/^imagem/i.test(l));const txt=lines.find(l=>/^texto/i.test(l));out.push("  Imagem: "+(img?img.replace(/^imagem:\s*/i,""):"foto de rotina coerente com a direção visual"));out.push("  Texto na arte: "+(txt?txt.replace(/^texto[^:]*:\s*/i,""):(hook||p.title)))}
  if(p.caption){out.push("");out.push("LEGENDA (vai no post, não na arte)");out.push(p.caption)}
  return out.join("\n");
}

/* ---------- leitura de insights com IA ---------- */
async function aiParse(text,files,fields,withPeriod){
  const keys=fields.map(([k,l])=>`"${k}": ${l}`).join("\n");
  const prompt=`Você extrai números de insights do Instagram (texto colado e/ou prints em português).
Responda só com um objeto JSON com estas chaves (use null quando o dado não aparecer; nunca invente):
${keys}
${withPeriod?'"periodStart": data inicial "AAAA-MM-DD" se aparecer\n"periodEnd": data final "AAAA-MM-DD" se aparecer\n':""}
Regras: números puros sem separador de milhar ("55.933" = 55933; "1,5 mil" = 1500; "2,3 mi" = 2300000). Percentuais de 0 a 100 ("33%" = 33). Tempo em segundos. Retenção: use a taxa de retenção ou a porcentagem de quem assistiu além dos primeiros segundos, a que aparecer. Ano de referência: ${new Date().getFullYear()}.
Texto colado:
"""${String(text||"").slice(0,12000)}"""`;
  const opts={modelTier:"quick"};if(files&&files.length)opts.images=files;
  return S.sample.json(prompt,opts);
}
/* ---------- modo gravação ---------- */
const TIME_RE=/^\s*\d+([.,]\d+)?\s*(s|seg)?\s*((a|até|-|–)\s*\d+([.,]\d+)?\s*(s|seg)?)?\s*$/i;
function hashStr(t){let h=0;for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0}return "h"+(h>>>0).toString(36)}
function parseRec(script){
  const lines=(script||"").split("\n").map(l=>l.trim()).filter(Boolean);
  const quoted=/["“”]/.test(script||"");
  return lines.map(line=>{
    const parts=line.split(/\s+·\s+/);const o={time:"",fala:"",tela:[],cena:[]};let cur=null;
    parts.forEach((pt,i)=>{
      const t=pt.trim();if(!t)return;
      if(i===0&&TIME_RE.test(t)){o.time=t;return}
      let mm;
      if((mm=t.match(/^(tela|texto na tela|na tela|lettering)\s*:\s*(.*)$/i))){o.tela.push(mm[2]);cur="tela";return}
      if((mm=t.match(/^(cena|visual|b-?roll|ação|enquadramento|plano)\s*:\s*(.*)$/i))){o.cena.push(mm[2]);cur="cena";return}
      if(cur&&!/["“”]/.test(t)){const arr=o[cur];arr[arr.length-1]=arr[arr.length-1]+" · "+t;return}
      if(/["“”]/.test(t)){const qs=[...t.matchAll(/["“]([^"”]+)["”]/g)].map(x=>x[1]);const rest=t.replace(/["“][^"”]+["”]/g," ").replace(/\s+/g," ").trim();
        if(qs.length)o.fala=[o.fala,...qs].filter(Boolean).join(" ");if(rest){o.cena.push(rest);cur="cena"}return}
      if(!quoted&&!o.fala){o.fala=t;return}
      o.cena.push(t);
    });
    o.key=hashStr(o.time+"|"+o.fala+"|"+o.tela.join("|"));
    return o;
  });
}
let recEl=null,recLock=null,recKey=null;
function recFs(){try{const v=Number(localStorage.getItem("cc_recfs"));if(v>=16&&v<=48)return v}catch(e){}return window.matchMedia&&matchMedia("(max-width:560px)").matches?22:26}
function closeRec(){if(!recEl)return;recEl.remove();recEl=null;window.removeEventListener("keydown",recKey,true);recKey=null;try{recLock&&recLock.release()}catch(e){}recLock=null;document.body.style.overflow=""}
function openRec(c,id,d,onStatus){

    }
  });
  recKey=e=>{if(!recEl)return;
    if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();closeRec();return}
    if(mode!=="gravar"||e.target.closest&&e.target.closest("button"))return;
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();if(i<segs.length-1){i++;draw()}}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();if(i>0){i--;draw()}}};
  window.addEventListener("keydown",recKey,true);

function hypEvidence(c,h){
  const t=h.test||{};if(!t.metric||!t.aField||!t.aValue||!t.bField||!t.bValue)return null;
  const pub=S.posts.filter(p=>p.status==="publicado"&&inCycle(c,p.date)&&val(p,t.metric)!=null);
  const match=(p,f,v)=>String(p[f]||"").toLowerCase().includes(String(v).toLowerCase());
  const A=pub.filter(p=>match(p,t.aField,t.aValue)),B=pub.filter(p=>match(p,t.bField,t.bValue));
  const pctm=["nonFollowersPct","ret3s"].includes(t.metric);
  return {A,B,a:avg(A.map(p=>val(p,t.metric))),b:avg(B.map(p=>val(p,t.metric))),unit:pctm?"%":"n"};
}
function timeline(c,pub,avV){
  if(!pub.length)return `<p class="muted">Sem publicações com views.</p>`;
  const W=560,H=220,pl=46,pr=12,pt=14,pb=34;const n=pub.length;const max=Math.max(...pub.map(p=>m(p,"views")),avV||0)*1.08;
  const raw=max/4;const mag=Math.pow(10,Math.floor(Math.log10(raw||1)));const nice=[1,2,2.5,5,10].find(x=>x*mag>=raw)*mag;
  const top=Math.ceil(max/nice)*nice;const y=v=>pt+(H-pt-pb)*(1-v/top);const bw=Math.min(36,(W-pl-pr)/n*0.62);const x=i=>pl+(W-pl-pr)*(i+0.5)/n;
  let g="";for(let v=0;v<=top+1e-9;v+=nice){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":v}</text>`}
  const every=Math.ceil(n/10);
  const bars=pub.map((p,i)=>{const v=m(p,"views");const h=Math.max(4,y(0)-y(v));return `<g data-tip="${esc((p.title||"Sem título")+" · "+dmy(p.date)+" · "+fmt(v)+" views")}"><rect x="${x(i)-bw/2-4}" y="${pt}" width="${bw+8}" height="${H-pt-pb}" fill="transparent"/><path d="M${x(i)-bw/2},${y(0)} v${-(h-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4} z" fill="${pillarColor(c,p.pillar)}"/></g>${i%every===0?`<text x="${x(i)}" y="${H-pb+16}" text-anchor="middle">${dmy(p.date)}</text>`:""}`}).join("");
  const avl=avV?`<line x1="${pl}" x2="${W-pr}" y1="${y(avV)}" y2="${y(avV)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(avV)-6}" text-anchor="end" style="fill:var(--ink)">média ${fmt(avV)}</text>`:"";
  return `<div style="overflow-x:auto"><svg class="svgchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Views por publicação">${g}${bars}${avl}</svg></div><p class="small muted">Cor da barra = pilar. Linha tracejada = média do ciclo.</p>`;
}
function md(t){
  const lines=esc(t||"").split("\n");let out="",inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  lines.forEach(l=>{const L=l.trim();
    if(/^[-*•]\s+/.test(L)){if(!inList){out+="<ul>";inList=true}out+="<li>"+inl(L.replace(/^[-*•]\s+/,""))+"</li>";return}
    if(inList){out+="</ul>";inList=false}
    if(/^#{1,4}\s+/.test(L)){out+="<h4>"+inl(L.replace(/^#{1,4}\s+/,""))+"</h4>";return}
    if(L)out+="<p>"+inl(L)+"</p>";
  });if(inList)out+="</ul>";return out;
}

function cycleContext(c){
  const {res}=decisions(c);const base=baseSnap(),after=finalSnap()||latestSnap();const cp=cycleProgress(c);
  const goals=(c.goals||[]).map(g=>{const s=goalState(c,g);return s?`- ${s.f.label}: base ${fmt(s.base,s.f.unit)}, meta ${g.direction==="down"?"abaixo de ":""}${fmt(s.target,s.f.unit)}, atual ${fmt(s.cur,s.f.unit)} (${s.sigL})`:""}).join("\n");
  const cmp=COMPARE.map(([k,l,u])=>{const a=snapVal(base,k),b=snapVal(after,k);return (a==null&&b==null)?"":`- ${l}: antes ${fmt(a,u)} · depois ${fmt(b,u)}`}).filter(Boolean).join("\n");
  const hyps=(c.hypotheses||[]).filter(h=>h.status!=="suspensa").map(h=>{const e=hypEvidence(c,h);return `- ${h.code} ${h.text}${e?` · A=${fmt(e.a,e.unit)} (${e.A.length} posts) x B=${fmt(e.b,e.unit)} (${e.B.length} posts)`:""}`}).join("\n");
  const posts=S.posts.filter(p=>inCycle(c,p.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`- ${p.date} | ${p.format} | ${p.pillar||"-"} | ${p.series||"-"} | "${p.title}" | ${ST[p.status]} | gancho: ${(p.hookType||"").slice(0,60)} | ${PMETRICS.map(([k,l])=>m(p,k)!=null?l+" "+m(p,k):"").filter(Boolean).join(", ")}${res[p.id]?" | regra: "+res[p.id].l:""}`).join("\n");
  return `PLANO
Objetivo do ciclo: ${c.testGoal||c.objective||"-"}
Público: ${c.audience||"-"}
Posicionamento: ${c.positioning||"-"}
Ponto de partida: ${(c.diagnosis&&c.diagnosis.summary)||"-"} Gap: ${(c.diagnosis&&c.diagnosis.gap)||"-"}
Pilares (peso planejado): ${(c.pillars||[]).map(p=>p.name+" ("+(p.weight??"?")+"%)").join("; ")}
Ciclo: ${c.cycle?.start||"?"} a ${c.cycle?.end||"?"}${cp?", dia "+Math.max(0,Math.min(cp.day,cp.total))+" de "+cp.total:""}. Hoje: ${iso(today())}.

ANTES E DEPOIS DO PERFIL
${cmp||"Sem prints"}

METAS
${goals||"-"}

HIPÓTESES
${hyps||"-"}

${posts||"Nenhuma"}`;
}

  btn.disabled=true;stop.hidden=false;live.innerHTML=`<div class="ai"><p class="muted">Pensando… a leitura leva de 20 segundos a 1 minuto.</p></div>`;
  const prompt=`Você é uma estrategista sênior de conteúdo para Instagram. Analise a semana do perfil ${c.name} ${c.handle||""} e escreva em português do Brasil, tom objetivo e profissional, frases curtas, sem travessões (não use "—" nem "–").
A PRIMEIRA linha deve ser exatamente "Veredito: " seguido de uma frase com a decisão mais importante da semana.
Depois use estas seções com "## ": Leitura geral, O que escalar, O que ajustar, O que cortar, Próximos passos. Use listas com "- ". Em Próximos passos, dê 3 ações concretas para a próxima semana (formato, pilar e tipo de gancho). Baseie tudo nos dados; quando faltar dado, diga qual print colar. Não invente números.

${cycleContext(c)}`;
  aiCtl=new AbortController();

    if(e&&e.code==="cancelled"){live.innerHTML=e.text?`<div class="ai">${md(e.text)}<p class="small muted">Interrompida.</p></div>`:""}
    else live.innerHTML=`<div class="notice">${{not_granted:"Leitura com IA não autorizada nesta visualização.",rate_limited:"Limite de uso atingido. Tente mais tarde.",prompt_too_large:"Dados demais para uma leitura. Reduza o ciclo."}[e&&e.code]||"Não foi possível gerar a leitura agora. Tente de novo."}</div>`;

function bankInsights(items){
